name: Aktualizace sazeb

on:
  schedule:
    # Pracovní dny v 17:00 UTC (18:00 SEČ / 19:00 SELČ), po závěru pražského dne.
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout veřejná data
        run: python scripts/update_rates.py
      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Data beze změny."
          else
            git commit -m "data: denní aktualizace sazeb"
            git push
          fi
